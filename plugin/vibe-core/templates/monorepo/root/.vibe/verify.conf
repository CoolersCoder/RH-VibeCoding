# vibe verify — monorepo root ({{PROJECT_NAME}})
# `vibe verify` here verifies every *affected* package in PACKAGES (changes vs HEAD or vs the merge-base with
# origin/main), each with its own <pkg>/.vibe/verify.conf, then runs the root STEPS below.
# `vibe verify --all` verifies every package.

PACKAGES='{{PACKAGES}}'

# Root-level steps run after the packages: repo-wide rules, cross-package integration, contract checks.
STEPS='rules'
FAST_STEPS='rules'
WATCH='.'
step_rules='"$VIBE" lint'
# step_integration='TODO e.g. pnpm -w run test:integration'
