# vibe verify — {{PROJECT_NAME}} (Node / TypeScript: web front end, Node back end, or full stack)
# Steps run in order from this directory with `bash -c`; non-zero = FAIL; 'skip' = SKIP.
# Adjust to package.json: swap npm for pnpm/yarn/bun, eslint for biome, vitest for jest, etc.

STEPS='rules format lint types test build'
FAST_STEPS='rules lint types'
WATCH='.'

step_rules='"$VIBE" lint'
step_format='npx --no-install prettier --check . --log-level warn'
step_lint='npx --no-install eslint . --max-warnings=0'
step_types='npx --no-install tsc --noEmit'
step_test='npm test --silent'
step_build='npm run build --if-present'
# Behaviour smoke (add 'smoke' to STEPS when ready), e.g.:
#   web:  step_smoke='npx --no-install playwright test --project=smoke'
#   api:  step_smoke='scripts/smoke.sh'   # start server, curl /health and one real endpoint, stop server
