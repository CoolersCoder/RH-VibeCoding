# vibe verify — {{PROJECT_NAME}} (generic stack)
# Steps run in order from this directory with `bash -c`; non-zero exit = FAIL; 'skip' (or empty) = SKIP.
# `vibe verify --fast` runs FAST_STEPS (keep it < 10 s). A full pass stamps .vibe/state/verified.
# Replace every 'skip' with the project's real command before relying on this.

STEPS='rules format lint types test build'
FAST_STEPS='rules format lint types'
# Paths whose changes need re-verification (space-separated, relative to this directory).
WATCH='.'

step_rules='"$VIBE" lint'      # project rules in .vibe/lint-rules (no-op if the file doesn't exist)
step_format='skip'             # e.g. a formatter in check mode
step_lint='skip'               # the language linter, warnings as errors
step_types='skip'              # type checker, if the language has one
step_test='skip'               # unit tests
step_build='skip'              # production build / compile
# step_smoke='skip'            # start the app and hit it once (add to STEPS when ready)
